name: Deploy Prime Checker to AWS Lambda

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f CICD/requirements.txt ]; then pip install -r CICD/requirements.txt; fi

      - name: Run unit tests
        run: |
          python -m unittest test_prime_checker.py -v

      - name: Run integration tests
        run: |
          python -m unittest CICD.test_lambda_handler -v

      - name: Generate test coverage report (optional)
        continue-on-error: true
        run: |
          pip install coverage
          coverage run -m unittest discover -s . -p "test_*.py"
          coverage report
          coverage html

      - name: Upload test coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate SAM template
        run: |
          cd CICD
          sam validate --lint

      - name: Build SAM application
        run: |
          cd CICD
          sam build --use-container

      - name: Deploy SAM application
        run: |
          cd CICD
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --s3-bucket ${{ secrets.SAM_S3_BUCKET }} \
            --s3-prefix prime-checker-dev \
            --stack-name prime-checker-dev \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides Environment=dev LogRetentionDays=7

      - name: Get API endpoint
        id: get-endpoint
        run: |
          cd CICD
          API_ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name prime-checker-dev \
            --query 'Stacks[0].Outputs[?OutputKey==`PrimeCheckerApi`].OutputValue' \
            --output text \
            --region ${{ env.AWS_REGION }})
          echo "API_ENDPOINT=$API_ENDPOINT" >> $GITHUB_OUTPUT
          echo "### Deployment Successful! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**API Endpoint:** \`$API_ENDPOINT\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test the endpoint:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "curl -X POST $API_ENDPOINT -H \"Content-Type: application/json\" -d '{\"number\": 17}'" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Run smoke test
        if: steps.get-endpoint.outputs.API_ENDPOINT != ''
        run: |
          echo "Running smoke test against deployed API..."
          RESPONSE=$(curl -s -X POST ${{ steps.get-endpoint.outputs.API_ENDPOINT }} \
            -H "Content-Type: application/json" \
            -d '{"number": 17}')
          echo "Response: $RESPONSE"

          # Check if response contains expected result
          if echo "$RESPONSE" | grep -q '"is_prime": true'; then
            echo "✅ Smoke test passed!"
          else
            echo "❌ Smoke test failed!"
            exit 1
          fi

      - name: Deployment summary
        if: always()
        run: |
          echo "Deployment completed at $(date)"
          echo "Stack name: prime-checker-dev"
          echo "Region: ${{ env.AWS_REGION }}"
